services:
  flaskapp:
    build:
      context: .
      dockerfile: docker/Dockerfile.prueba
    container_name: flask_con_volumen
    ports:
      - "8080:8080"
    environment:
      VAR2: Mundo variable
    # 👇 Esta línea enlaza tu código local al contenedor directamente
    volumes:
      - ./warp:/app         
    working_dir: /app
    command: python prueba.py